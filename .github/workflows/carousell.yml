name: Carousell search

on:
  workflow_dispatch:
    inputs:
      query:
        description: Search terms
        required: true
        type: string
      region:
        description: Carousell site
        type: choice
        default: sg
        options: [sg, my, hk, ph, tw]
      sort:
        description: Sort order
        type: choice
        default: best
        options: [best, recent, price-low, price-high]
      min_price:
        description: Minimum price (optional)
        type: string
        default: ""
      max_price:
        description: Maximum price (optional)
        type: string
        default: ""
      limit:
        description: Maximum listings
        type: string
        default: "50"
      stealth:
        description: Use stealth mode
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: carousell-search-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  OPENSSL_NO_VENDOR: "1"

jobs:
  search:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: obscura-carousell

      - name: Repair incomplete V8 cache
        run: |
          # rust-cache removes gn_out but can retain V8's build-script metadata.
          if [[ ! -f target/release/gn_out/obj/librusty_v8.a || ! -s target/release/gn_out/obj/librusty_v8.a ]]; then
            rm -f -- target/release/gn_out/obj/librusty_v8.a target/release/gn_out/obj/librusty_v8.sum
            cargo clean --release -p v8
          fi

      - name: Build
        run: cargo build --release -p obscura-cli --bins --features render,stealth

      - name: Validate inputs
        env:
          MIN_PRICE: ${{ inputs.min_price }}
          MAX_PRICE: ${{ inputs.max_price }}
          LIMIT: ${{ inputs.limit }}
        run: |
          for pair in "min_price=$MIN_PRICE" "max_price=$MAX_PRICE" "limit=$LIMIT"; do
            value="${pair#*=}"
            if [[ -n "$value" && ! "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::${pair%%=*} must be a whole number, got '$value'"
              exit 1
            fi
          done

      - name: Search
        env:
          QUERY: ${{ inputs.query }}
          REGION: ${{ inputs.region }}
          SORT: ${{ inputs.sort }}
          MIN_PRICE: ${{ inputs.min_price }}
          MAX_PRICE: ${{ inputs.max_price }}
          LIMIT: ${{ inputs.limit }}
          STEALTH: ${{ inputs.stealth }}
          # Optional repository secret, e.g. http://user:pass@host:port.
          # GitHub runners use datacenter IPs that Cloudflare often challenges.
          CAROUSELL_PROXY: ${{ secrets.CAROUSELL_PROXY }}
        run: |
          set -euo pipefail
          global=()
          [[ "$STEALTH" == "true" ]] && global+=(--stealth)
          [[ -n "$CAROUSELL_PROXY" ]] && global+=(--proxy "$CAROUSELL_PROXY")
          args=(--region "$REGION" --sort "$SORT" --limit "${LIMIT:-50}" --format json -o listings.json)
          [[ -n "$MIN_PRICE" ]] && args+=(--min-price "$MIN_PRICE")
          [[ -n "$MAX_PRICE" ]] && args+=(--max-price "$MAX_PRICE")
          ./target/release/obscura "${global[@]}" carousell "${args[@]}" -- "$QUERY"

      - name: Write summary
        if: always()
        env:
          QUERY: ${{ inputs.query }}
          REGION: ${{ inputs.region }}
        run: |
          python3 - <<'EOF'
          import json, os
          query, region = os.environ["QUERY"], os.environ["REGION"]
          out = [f"## Carousell ({region}): {query}", ""]
          try:
              listings = json.load(open("listings.json"))
          except (OSError, ValueError):
              listings = None
          def cell(v):
              return str(v or "-").replace("|", "\\|").replace("\n", " ")
          if listings is None:
              out.append("Search failed. See the Search step log (Carousell may have served a bot challenge).")
          elif not listings:
              out.append("No listings found.")
          else:
              out += [f"{len(listings)} listing(s)", "",
                      "| Price | Title | Condition | Seller | Posted |",
                      "|---|---|---|---|---|"]
              for l in listings:
                  title = cell(l.get("title"))
                  if l.get("url"):
                      title = f"[{title}]({l['url']})"
                  out.append(f"| {cell(l.get('price'))} | {title} | {cell(l.get('condition'))} | "
                             f"{cell(l.get('seller'))} | {cell(l.get('posted'))} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(out) + "\n")
          EOF

      - name: Upload listings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carousell-listings-${{ github.run_id }}
          path: listings.json
          if-no-files-found: ignore
